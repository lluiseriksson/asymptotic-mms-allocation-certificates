[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asymptotic-mms-allocation-certificates"
version = "1.0.0"
description = "Machine-checked Lean 4 & exact-Q certificate auditor for (1-eps)-MMS goods and (1+eps)-MMS chores allocations"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Lluis Eriksson"}]

[tool.pytest.ini_options]
testpaths = ["tests"]
